{{- $viewer := readFile "static/research/protein-buildings/index.html" -}}
{{- $main := index (findRE `(?s)<main>.*?</main>` $viewer) 0 -}}
{{- $sourceScript := index (findRE `(?s)<script>.*?</script>` $viewer) 0 -}}
{{- $modelExpr := replaceRE `(?s)^<script>const models=|;let a=.*</script>$` "" $sourceScript -}}
<div class="research-inline-viewer">
  {{ $main | safeHTML }}
  <script>
  (() => {
    const models = {{ $modelExpr | safeJS }};
    const root = document.currentScript.closest('.research-inline-viewer');
    const left = root.querySelector('#left'), right = root.querySelector('#right');
    const pick = root.querySelector('#pick'), reset = root.querySelector('#reset');
    const desc = root.querySelector('#desc'), source = root.querySelector('#src');
    const notes = { '1SHS':'The modules wrap around a hollow center in 24 repeated subunits. Inspect how the openings align through the shell.', '3J5P':'Four chains surround a shared pore. Rotate toward the channel axis to look through its center.', '1GOW':'Four folded subunits define four interlocking building masses. The voids follow the spacing of those subunits.', '1EZG':'The downloaded assembly contains two chain traces. Repeated turns within each chain determine the arrangement of its stacked modules.' };
    Object.entries(models).forEach(([key, value]) => pick.add(new Option(value[0], key)));
    let yaw = .35, pitch = .32, pending = false;
    const project = (p, w, h) => { const [x,y,z] = p, d = x*Math.sin(yaw)+y*Math.cos(yaw), s = Math.min(w,h)/165; return [w/2+s*(x*Math.cos(yaw)-y*Math.sin(yaw)), h/2+s*(d*Math.sin(pitch)-z*Math.cos(pitch)), d*Math.cos(pitch)+z*Math.sin(pitch)]; };
    function draw(canvas, chains, key, buildings) {
      const box = canvas.getBoundingClientRect(), ratio = Math.min(devicePixelRatio || 1, 2), w = Math.max(1, box.width|0), h = Math.max(1, box.height|0);
      canvas.width=w*ratio; canvas.height=h*ratio; const g=canvas.getContext('2d'); g.setTransform(ratio,0,0,ratio,0,0); g.clearRect(0,0,w,h); const ops=[];
      chains.forEach((chain, ci) => { const hue=(ci*137+166)%360; chain.forEach((p, pi) => {
        if (!buildings) { if (!pi) return; const prev=chain[pi-1]; if (Math.hypot(...p.map((v,i)=>v-prev[i]))>2.3*Math.max(1,Math.hypot(...chain[0].map((v,i)=>v-chain[1][i])))) return; const a=project(prev,w,h), b=project(p,w,h); ops.push([(a[2]+b[2])/2,()=>{g.strokeStyle=`hsl(${hue} 42% 40%)`;g.lineWidth=1.5;g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();}]); return; }
        const size=key==='1EZG'?4.2:2.2, vs=[]; for(const z of [-.6,.6]) for(const [x,y] of [[-1,-1],[1,-1],[1,1],[-1,1]]) vs.push(project([p[0]+size*x,p[1]+size*y,p[2]+z*size],w,h));
        [[[0,1,5,4],45],[[1,2,6,5],52],[[2,3,7,6],46],[[3,0,4,7],54],[[4,5,6,7],74],[[0,1,2,3],39]].forEach(([face,light])=>{const q=face.map(i=>vs[i]);ops.push([q.reduce((s,v)=>s+v[2],0)/4,()=>{g.fillStyle=`hsl(${hue} 30% ${light}%)`;g.beginPath();q.forEach((v,i)=>i?g.lineTo(v[0],v[1]):g.moveTo(v[0],v[1]));g.closePath();g.fill();}]);});
      }); }); ops.sort((a,b)=>a[0]-b[0]).forEach(op=>op[1]());
    }
    function render(){ pending=false; const key=pick.value, chains=models[key][1]; desc.textContent=notes[key]; source.href=`https://www.rcsb.org/structure/${key}`; draw(left,chains,key,false); draw(right,chains,key,true); }
    function schedule(){ if(!pending){pending=true;requestAnimationFrame(render);} }
    function resetView(){yaw=.35;pitch=.32;schedule();}
    [left,right].forEach(canvas=>{let drag=null; canvas.addEventListener('pointerdown',e=>{e.preventDefault();drag={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);}); canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;e.preventDefault();yaw+=(e.clientX-drag.x)*.009;pitch=Math.max(-1.35,Math.min(1.35,pitch+(e.clientY-drag.y)*.009));drag.x=e.clientX;drag.y=e.clientY;schedule();}); ['pointerup','pointercancel','lostpointercapture'].forEach(t=>canvas.addEventListener(t,()=>drag=null));});
    pick.addEventListener('change',resetView); reset.addEventListener('click',resetView); addEventListener('resize',schedule,{passive:true}); const initial=location.hash.slice(1).toUpperCase(); if(models[initial])pick.value=initial; render();
  })();
  </script>
</div>
